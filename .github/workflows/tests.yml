name: tests

# 只跑不依赖外部服务的那部分测试：server/auth.py、server/user_store.py 以及
# 后续新增的同类单元测试。它们的导入链只到 fastapi / PyJWT / SQLAlchemy，
# 因此 CI 里装最小依赖即可，不必装 openjiuwen / Neo4j / Chroma。
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: 接口与鉴权单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装最小测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.110" "PyJWT>=2.8" "SQLAlchemy>=2.0" "pytest>=8" "httpx>=0.27"

      - name: 运行 tests/
        run: pytest tests/ -q
